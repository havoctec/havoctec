# Generates an animated SVG of a "snake" eating your contribution graph.
#
# SETUP:
# 1. Put this file at: .github/workflows/snake.yml
#    (in the special repo named exactly like your username/org, e.g. "havoctec/havoctec")
# 2. Commit and push to your default branch.
# 3. The workflow runs automatically (daily + on push) and publishes the SVGs
#    to a branch called "output".
# 4. Reference the output in your README with:
#    https://raw.githubusercontent.com/<your-username>/<your-username>/output/github-contribution-grid-snake-dark.svg
#
# No further setup needed — GITHUB_TOKEN is provided automatically by Actions.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}    # allows manual runs from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
