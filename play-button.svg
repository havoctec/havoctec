<svg width="340" height="72" viewBox="0 0 340 72" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="btnFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F8FD1"/>
      <stop offset="100%" stop-color="#0E75B6"/>
    </linearGradient>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .glow{
        transform-origin: 170px 36px;
        animation: pulse 2.2s ease-in-out infinite alternate;
      }
      @keyframes pulse{
        0%   { opacity: 0.30; transform: scale(0.97); }
        100% { opacity: 0.70; transform: scale(1.05); }
      }
      .cursor{
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink{
        0%, 49%  { opacity: 1; }
        50%, 100%{ opacity: 0; }
      }
      .btn-group{
        transform-origin: 170px 36px;
        animation: rise 2.2s ease-in-out infinite alternate;
      }
      @keyframes rise{
        0%   { transform: translateY(0px); }
        100% { transform: translateY(-2px); }
      }
      text{
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      }
    </style>
  </defs>

  <rect class="glow" x="14" y="8" width="312" height="56" rx="12" fill="#2F8FD1" filter="url(#glowBlur)"/>

  <g class="btn-group">
    <rect x="14" y="8" width="312" height="56" rx="12" fill="url(#btnFill)" stroke="#0A5A8F" stroke-width="1"/>

    <polygon points="40,25 40,47 60,36" fill="#0B1220"/>

    <text x="76" y="31" font-size="14" font-weight="700" letter-spacing="0.5" fill="#0B1220">PLAY: STACK MATCH</text>
    <text x="76" y="49" font-size="11" letter-spacing="0.5" fill="#E8EEF7">flip · match · beat your time</text>

    <rect class="cursor" x="292" y="40" width="8" height="12" fill="#0B1220"/>
  </g>
</svg>
